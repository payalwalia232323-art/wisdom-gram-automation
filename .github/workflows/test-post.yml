            echo "No history changes."
          else
            git commit -m "Update used proverb history"
            git push
          fi

      - name: Download relevant Pexels background
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SEARCH_QUERY: ${{ steps.proverb.outputs.search }}
        run: |
          python - <<'PY'
          import os
          import requests

          api_key = os.environ["PEXELS_API_KEY"]
          query = os.environ["SEARCH_QUERY"]

          headers = {
              "Authorization": api_key
          }

          params = {
              "query": query,
              "orientation": "portrait",
              "size": "large",
              "per_page": 15
          }

          response = requests.get(
              "https://api.pexels.com/v1/search",
              headers=headers,
              params=params,
              timeout=30
          )

          response.raise_for_status()

          photos = response.json().get("photos", [])

          if not photos:
              raise Exception(
                  "No Pexels photos found for: " + query
              )

          # Prefer photos with portrait dimensions
          selected = None

          for photo in photos:
              width = photo.get("width", 0)
              height = photo.get("height", 0)

              if height >= width:
                  selected = photo
                  break

          if selected is None:
              selected = photos[0]

          image_url = (
              selected["src"].get("large2x")
              or selected["src"].get("large")
              or selected["src"]["original"]
          )

          print("Selected Pexels photo:", selected["id"])
          print("Photographer:", selected["photographer"])

          image_response = requests.get(
              image_url,
              timeout=60
          )

          image_response.raise_for_status()

          with open("background.jpg", "wb") as f:
              f.write(image_response.content)

          with open("pexels-source.txt", "w") as f:
              f.write(
                  "Photo by "
                  + selected["photographer"]
                  + " on Pexels\n"
                  + selected["url"]
              )

          print("Background downloaded successfully.")
          PY

      - name: Create Reel video
        env:
          PROVERB: ${{ steps.proverb.outputs.proverb }}
          MEANING: ${{ steps.proverb.outputs.meaning }}
        run: |
          python - <<'PY'
          import os
          from PIL import Image, ImageDraw, ImageFont
          import subprocess

          W, H = 1080, 1920

          proverb = os.environ["PROVERB"]
          meaning = os.environ["MEANING"]

          img = Image.open("background.jpg").convert("RGB")

          target_ratio = W / H
          current_ratio = img.width / img.height

          if current_ratio > target_ratio:
              new_width = int(img.height * target_ratio)
              left = (img.width - new_width) // 2
              img = img.crop(
                  (left, 0, left + new_width, img.height)
              )
          else:
              new_height = int(img.width / target_ratio)
              top = (img.height - new_height) // 2
              img = img.crop(
                  (0, top, img.width, top + new_height)
              )

          img = img.resize(
              (W, H),
              Image.Resampling.LANCZOS
          )

          # Darken background
          overlay = Image.new(
              "RGBA",
              (W, H),
              (0, 0, 0, 90)
          )

          img = Image.alpha_composite(
              img.convert("RGBA"),
              overlay
          )

          draw = ImageDraw.Draw(img)

          proverb_font = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              64
          )

          meaning_font = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
              38
          )

          brand_font = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
              30
          )

          def wrap_text(text, font, max_width):
              words = text.split()
              lines = []
              current = ""

              for word in words:
                  test = (
                      current + " " + word
                  ).strip()

                  box = draw.textbbox(
                      (0, 0),
                      test,
                      font=font
                  )

                  if box[2] - box[0] <= max_width:
                      current = test
                  else:
                      if current:
                          lines.append(current)
                      current = word

              if current:
                  lines.append(current)

              return lines

          # Proverb
          proverb_lines = wrap_text(
              proverb,
              proverb_font,
              850
          )

          # Meaning
          meaning_lines = wrap_text(
              meaning,
              meaning_font,
              820
          )

          total_proverb_height = len(proverb_lines) * 82
          total_meaning_height = len(meaning_lines) * 55

          total_height = (
              total_proverb_height
              + 80
              + total_meaning_height
          )

          y = (H - total_height) // 2 - 30

          for line in proverb_lines:
              box = draw.textbbox(
                  (0, 0),
                  line,
                  font=proverb_font
              )

              width = box[2] - box[0]

              x = (W - width) / 2

              draw.text(
                  (x + 3, y + 3),
                  line,
                  font=proverb_font,
                  fill=(0, 0, 0, 200)
              )

              draw.text(
                  (x, y),
                  line,
                  font=proverb_font,
                  fill="white"
              )

              y += 82

          y += 55

          for line in meaning_lines:
              box = draw.textbbox(
                  (0, 0),
                  line,
                  font=meaning_font
              )

              width = box[2] - box[0]

              x = (W - width) / 2

              draw.text(
                  (x + 2, y + 2),
                  line,
                  font=meaning_font,
                  fill=(0, 0, 0, 180)
              )

              draw.text(
                  (x, y),
                  line,
                  font=meaning_font,
                  fill=(245, 245, 245)
              )

              y += 55

          # Branding
          brand = "wisdom_gram"

          box = draw.textbbox(
              (0, 0),
              brand,
              font=brand_font
          )

          brand_width = box[2] - box[0]

          draw.text(
              (
                  (W - brand_width) / 2,
                  1780
              ),
              brand,
              font=brand_font,
              fill=(255, 255, 255, 220)
          )

          img.convert("RGB").save(
              "frame.jpg",
              quality=95
          )

          subprocess.run([
              "ffmpeg",
              "-y",
              "-loop", "1",
              "-i", "frame.jpg",
              "-t", "8",
              "-r", "30",
              "-vf", "format=yuv420p",
              "-c:v", "libx264",
              "-preset", "medium",
              "-crf", "20",
              "-movflags", "+faststart",
              "wisdom-reel.mp4"
          ], check=True)

          print("Reel created successfully.")
          PY

      - name: Upload Reel to Cloudinary
        id: cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python - <<'PY'
          import cloudinary
          import cloudinary.uploader
          import os

          cloudinary.config(
              cloud_name=os.environ["CLOUDINARY_CLOUD_NAME"],
              api_key=os.environ["CLOUDINARY_API_KEY"],
              api_secret=os.environ["CLOUDINARY_API_SECRET"]
          )

          result = cloudinary.uploader.upload(
              "wisdom-reel.mp4",
              public_id="wisdom-gram/daily-reel",
              overwrite=True,
              resource_type="video"
          )

          print("Cloudinary URL:", result["secure_url"])

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(
                  "video_url="
                  + result["secure_url"]
                  + "\n"
              )
          PY

      - name: Create Instagram Reel container
        id: container
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PROVERB: ${{ steps.proverb.outputs.proverb }}
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://graph.instagram.com/v15.0/${IG_USER_ID}/media" \
            -F "media_type=REELS" \
            -F "video_url=${{ steps.cloudinary.outputs.video_url }}" \
            -F "caption=${PROVERB} #wisdom #proverbs #mindset #lifequotes #wisdomgram" \
            -F "share_to_feed=true" \
            -F "access_token=${IG_ACCESS_TOKEN}")

          echo "$RESPONSE"

          CONTAINER_ID=$(echo "$RESPONSE" | python -c "import sys,json; print(json.load(sys.stdin)['id'])")

          echo "container_id=$CONTAINER_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Reel processing
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          for i in {1..24}; do

            RESPONSE=$(curl -s \
              "https://graph.instagram.com/v15.0/${{ steps.container.outputs.container_id }}?fields=status_code,status&access_token=${IG_ACCESS_TOKEN}")

            echo "$RESPONSE"

            if echo "$RESPONSE" | grep -q '"status_code":"FINISHED"'; then
              echo "Reel is ready."
              exit 0
            fi

            if echo "$RESPONSE" | grep -q '"status_code":"ERROR"'; then
              echo "Instagram rejected the Reel."
              exit 1
            fi

            sleep 10
          done

          echo "Reel processing timed out."
          exit 1

      - name: Publish Reel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://graph.instagram.com/v15.0/${IG_USER_ID}/media_publish" \
            -F "creation_id=${{ steps.container.outputs.container_id }}" \
            -F "access_token=${IG_ACCESS_TOKEN}")

          echo "$RESPONSE"
