name: Wisdom Gram Free Reel Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-and-publish-reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install pillow cloudinary requests

      - name: Download relevant Pexels background
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import requests

          API_KEY = os.environ["PEXELS_API_KEY"]

          # Test proverb
          search_query = "old tree forest axe nature"

          headers = {
              "Authorization": API_KEY
          }

          params = {
              "query": search_query,
              "orientation": "portrait",
              "per_page": 15
          }

          response = requests.get(
              "https://api.pexels.com/v1/search",
              headers=headers,
              params=params,
              timeout=30
          )

          response.raise_for_status()

          data = response.json()
          photos = data.get("photos", [])

          if not photos:
              raise Exception("No suitable Pexels photos found.")

          # Pick the first suitable portrait image
          selected = photos[0]

          image_url = (
              selected["src"].get("large2x")
              or selected["src"].get("large")
              or selected["src"]["original"]
          )

          print("Selected Pexels photo:", selected["id"])
          print("Photo URL:", image_url)

          image_response = requests.get(
              image_url,
              timeout=60
          )

          image_response.raise_for_status()

          with open("background.jpg", "wb") as f:
              f.write(image_response.content)

          # Save source information
          with open("pexels-source.txt", "w") as f:
              f.write(
                  "Photo by "
                  + selected["photographer"]
                  + " on Pexels\n"
                  + selected["url"]
              )

          print("Background downloaded successfully.")
          PY

      - name: Create Reel video
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import subprocess

          W, H = 1080, 1920

          # Load Pexels background
          img = Image.open("background.jpg").convert("RGB")

          # Crop image to exact 9:16
          target_ratio = W / H
          current_ratio = img.width / img.height

          if current_ratio > target_ratio:
              new_width = int(img.height * target_ratio)
              left = (img.width - new_width) // 2

              img = img.crop(
                  (left, 0, left + new_width, img.height)
              )

          else:
              new_height = int(img.width / target_ratio)
              top = (img.height - new_height) // 2

              img = img.crop(
                  (0, top, img.width, top + new_height)
              )

          img = img.resize(
              (W, H),
              Image.Resampling.LANCZOS
          )

          # Dark overlay for readable text
          overlay = Image.new(
              "RGBA",
              (W, H),
              (0, 0, 0, 85)
          )

          img = Image.alpha_composite(
              img.convert("RGBA"),
              overlay
          )

          draw = ImageDraw.Draw(img)

          font = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              66
          )

          meaning_font = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
              40
          )

          small = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
              30
          )

          proverb = (
              "The axe forgets,\n"
              "but the tree remembers."
          )

          meaning = (
              "Some wounds heal.\n"
              "Some simply teach you\n"
              "who caused them."
          )

          # Proverb
          y = 640

          for line in proverb.split("\n"):

              box = draw.textbbox(
                  (0, 0),
                  line,
                  font=font
              )

              width = box[2] - box[0]

              # Shadow
              draw.text(
                  (
                      (W - width) / 2 + 3,
                      y + 3
                  ),
                  line,
                  font=font,
                  fill=(0, 0, 0, 190)
              )

              # Main text
              draw.text(
                  (
                      (W - width) / 2,
                      y
                  ),
                  line,
                  font=font,
                  fill="white"
              )

              y += 92

          # Meaning
          y += 65

          for line in meaning.split("\n"):

              box = draw.textbbox(
                  (0, 0),
                  line,
                  font=meaning_font
              )

              width = box[2] - box[0]

              draw.text(
                  (
                      (W - width) / 2 + 2,
                      y + 2
                  ),
                  line,
                  font=meaning_font,
                  fill=(0, 0, 0, 170)
              )

              draw.text(
                  (
                      (W - width) / 2,
                      y
                  ),
                  line,
                  font=meaning_font,
                  fill=(245, 245, 245)
              )

              y += 58

          # Branding
          brand = "wisdom_gram"

          box = draw.textbbox(
              (0, 0),
              brand,
              font=small
          )

          width = box[2] - box[0]

          draw.text(
              (
                  (W - width) / 2,
                  1770
              ),
              brand,
              font=small,
              fill=(255, 255, 255, 220)
          )

          img.convert("RGB").save(
              "frame.jpg",
              quality=95
          )

          # Create 8-second Reel
          subprocess.run([
              "ffmpeg",
              "-y",
              "-loop", "1",
              "-i", "frame.jpg",
              "-t", "8",
              "-r", "30",
              "-vf", "format=yuv420p",
              "-c:v", "libx264",
              "-preset", "medium",
              "-crf", "20",
              "-movflags", "+faststart",
              "wisdom-reel.mp4"
          ], check=True)

          print("Reel created successfully.")
          PY

      - name: Upload Reel to Cloudinary
        id: cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python - <<'PY'
          import cloudinary
          import cloudinary.uploader
          import os

          cloudinary.config(
              cloud_name=os.environ["CLOUDINARY_CLOUD_NAME"],
              api_key=os.environ["CLOUDINARY_API_KEY"],
              api_secret=os.environ["CLOUDINARY_API_SECRET"]
          )

          result = cloudinary.uploader.upload(
              "wisdom-reel.mp4",
              public_id="wisdom-gram/free-reel-test",
              overwrite=True,
              resource_type="video"
          )

          print("Cloudinary URL:", result["secure_url"])

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(
                  "video_url="
                  + result["secure_url"]
                  + "\n"
              )
          PY

      - name: Create Instagram Reel container
        id: container
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://graph.instagram.com/v15.0/${IG_USER_ID}/media" \
            -F "media_type=REELS" \
            -F "video_url=${{ steps.cloudinary.outputs.video_url }}" \
            -F "caption=The axe forgets, but the tree remembers. Some wounds heal. Some simply teach you who caused them. #wisdom #proverbs #mindset #lifequotes #wisdomgram" \
            -F "share_to_feed=true" \
            -F "access_token=${IG_ACCESS_TOKEN}")

          echo "$RESPONSE"

          CONTAINER_ID=$(echo "$RESPONSE" | python -c "import sys,json; print(json.load(sys.stdin)['id'])")

          echo "container_id=$CONTAINER_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Reel processing
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          for i in {1..24}; do

            RESPONSE=$(curl -s \
              "https://graph.instagram.com/v15.0/${{ steps.container.outputs.container_id }}?fields=status_code,status&access_token=${IG_ACCESS_TOKEN}")

            echo "$RESPONSE"

            if echo "$RESPONSE" | grep -q '"status_code":"FINISHED"'; then
              echo "Reel is ready."
              exit 0
            fi

            if echo "$RESPONSE" | grep -q '"status_code":"ERROR"'; then
              echo "Instagram rejected the Reel."
              exit 1
            fi

            sleep 10
          done

          echo "Reel processing timed out."
          exit 1

      - name: Publish Reel
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://graph.instagram.com/v15.0/${IG_USER_ID}/media_publish" \
            -F "creation_id=${{ steps.container.outputs.container_id }}" \
            -F "access_token=${IG_ACCESS_TOKEN}")

          echo "$RESPONSE"
