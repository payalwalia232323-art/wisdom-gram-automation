          selected = None

          for item in proverbs:
              if item["proverb"] not in used_set:
                  selected = item
                  break

          # Restart after all proverbs have been used
          if selected is None:
              used = []
              selected = proverbs[0]

          used.append(selected["proverb"])

          with open(history_file, "w") as f:
              json.dump(used, f, indent=2)

