name: Wisdom Gram Test Post

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post-to-instagram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install pillow cloudinary

      - name: Create test image
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          import textwrap

          img = Image.new("RGB", (1080, 1080), (20, 20, 20))
          draw = ImageDraw.Draw(img)

          font = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 48
          )
          small = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 28
          )

          quote = "Your future changes when your daily choices change."

          lines = textwrap.wrap(quote, width=30)
          y = 390

          for line in lines:
              box = draw.textbbox((0, 0), line, font=font)
              width = box[2] - box[0]
              draw.text(
                  ((1080 - width) / 2, y),
                  line,
                  font=font,
                  fill="white"
              )
              y += 70

          brand = "wisdom_gram"
          box = draw.textbbox((0, 0), brand, font=small)
          width = box[2] - box[0]

          draw.text(
              ((1080 - width) / 2, 930),
              brand,
              font=small,
              fill="white"
          )

          img.save("wisdom-test.jpg", "JPEG", quality=95)
          PY

      - name: Upload image to Cloudinary
        id: cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python - <<'PY'
          import cloudinary
          import cloudinary.uploader
          import os

          cloudinary.config(
              cloud_name=os.environ["CLOUDINARY_CLOUD_NAME"],
              api_key=os.environ["CLOUDINARY_API_KEY"],
              api_secret=os.environ["CLOUDINARY_API_SECRET"]
          )

          result = cloudinary.uploader.upload(
              "wisdom-test.jpg",
              public_id="wisdom-gram/test-post",
              overwrite=True,
              resource_type="image"
          )

          print("Cloudinary URL:", result["secure_url"])

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("image_url=" + result["secure_url"] + "\n")
          PY

      - name: Create Instagram media container
        id: container
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://graph.instagram.com/v15.0/${IG_USER_ID}/media" \
            -F "image_url=${{ steps.cloudinary.outputs.image_url }}" \
            -F "caption=Your future changes when your daily choices change. #wisdom #mindset #selfimprovement #wisdomgram" \
            -F "access_token=${IG_ACCESS_TOKEN}")

          echo "$RESPONSE"

          CONTAINER_ID=$(echo "$RESPONSE" | python -c "import sys,json; print(json.load(sys.stdin)['id'])")

          echo "container_id=$CONTAINER_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Instagram container
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          for i in {1..12}; do
            STATUS=$(curl -s \
              "https://graph.instagram.com/v15.0/${{ steps.container.outputs.container_id }}?fields=status_code&access_token=${IG_ACCESS_TOKEN}")

            echo "$STATUS"

            if echo "$STATUS" | grep -q "FINISHED"; then
              exit 0
            fi

            sleep 10
          done

          echo "Instagram container was not ready."
          exit 1

      - name: Publish to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://graph.instagram.com/v15.0/${IG_USER_ID}/media_publish" \
            -F "creation_id=${{ steps.container.outputs.container_id }}" \
            -F "access_token=${IG_ACCESS_TOKEN}")

          echo "$RESPONSE"
